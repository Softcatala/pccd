include:
  - project: "docker/process-webhooks"
    file: "/gitlab/deploy.yml"

variables:
  PROJECT_TO_BE_DEPLOYED: "docker/pccd"
  DOCKER_PHP_EXTENSION_INSTALLER_VERSION: "2.11.12"

stages:
  - build
  - deploy

build:
  image: docker:latest
  services:
    - docker:dind
  stage: build
  when: manual
  before_script:
    - export DATETAG=$(date +%Y%m%d-%H%M%S)
    - echo $CI_REGISTRY_PASSWORD | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Build php-fpm image
    - DOCKER_IMAGE=${CI_REGISTRY_IMAGE}/pccd-php
    - |
      docker build -f .docker/fpm.Dockerfile \
        --cache-from $DOCKER_IMAGE:latest \
        --tag $DOCKER_IMAGE:$CI_COMMIT_SHA \
        --tag $DOCKER_IMAGE:$DATETAG \
        --tag $DOCKER_IMAGE:latest \
        --build-arg ARG_MYSQL_PWD=$MYSQL_PWD \
        --build-arg ARG_WEB_ADMIN_PWD=$WEB_ADMIN_PWD \
        .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:$DATETAG
    - docker push $DOCKER_IMAGE:latest
    # Build nginx image
    - DOCKER_IMAGE=${CI_REGISTRY_IMAGE}/pccd-nginx
    - |
      docker build -f .docker/nginx.Dockerfile \
        --cache-from $DOCKER_IMAGE:latest \
        --tag $DOCKER_IMAGE:$CI_COMMIT_SHA \
        --tag $DOCKER_IMAGE:$DATETAG \
        --tag $DOCKER_IMAGE:latest \
        .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:$DATETAG
    - docker push $DOCKER_IMAGE:latest
    # Build database image
    - DOCKER_IMAGE=${CI_REGISTRY_IMAGE}/pccd-sql
    - |
      docker build -f .docker/sql.Dockerfile \
        --cache-from $DOCKER_IMAGE:latest \
        --tag $DOCKER_IMAGE:$CI_COMMIT_SHA \
        --tag $DOCKER_IMAGE:$DATETAG \
        --tag $DOCKER_IMAGE:latest \
        --build-arg ARG_MYSQL_PWD=$MYSQL_PWD \
        .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:$DATETAG
    - docker push $DOCKER_IMAGE:latest

deploy:
  stage: deploy
  when: manual
  needs: [build]
  extends:
    - .default-deploy

reset:
  stage: deploy
  when: manual
  needs: [build]
  extends:
    - .reset

# Run php-based code quality scripts
.check_code_php_template:
  stage: build
  script:
    - >
      if [ "${PHP_VERSION}" = "8.6-rc" ]; then
        apk --no-cache --update add git unzip $PHPIZE_DEPS icu-dev icu-data-full libpng-dev freetype-dev
        docker-php-ext-configure gd --with-freetype
        docker-php-ext-configure mbstring --disable-mbregex
        docker-php-ext-install -j"$(nproc)" gd intl mbstring pdo_mysql
      else
        apk --no-cache --update add curl git unzip
        curl --silent --show-error --location --fail --output /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/download/${DOCKER_PHP_EXTENSION_INSTALLER_VERSION}/install-php-extensions
        chmod +x /usr/local/bin/install-php-extensions
        install-php-extensions gd intl mbstring pdo_mysql
      fi
    - >
      if [ "${PHP_VERSION}" = "8.6-rc" ]; then
        ./composer.phar install --no-interaction --ignore-platform-req=php;
      else
        ./composer.phar install --no-interaction;
      fi
    - ./composer.phar validate --strict
    - ./composer.phar run php-l
    - ./composer.phar run composer-normalize-lint
    - ./composer.phar run phpcs
    - ./composer.phar run php-cs-fixer-lint
    - ./composer.phar run phpstan
    - >
      if [ "${PHP_VERSION}" != "8.6-rc" ]; then
        ./composer.phar run psalm;
      fi
    - ./composer.phar run phpunit
    # Install and run phpstan with the latest development version
    - PHPSTAN_MAJOR=$(php -r 'echo explode(".", ltrim(json_decode(file_get_contents("composer.json"), true)["require-dev"]["phpstan/phpstan"], "^~>=v"))[0];')
    - PHPSTAN_DEV=$(./composer.phar show phpstan/phpstan --available --format=json | grep -oE "${PHPSTAN_MAJOR}\.[0-9]+\.x-dev" | sort -t. -k2 -n | tail -1)
    - >
      if [ "${PHP_VERSION}" = "8.6-rc" ]; then
        ./composer.phar require --dev "phpstan/phpstan:${PHPSTAN_DEV}" --with-all-dependencies --ignore-platform-req=php;
      else
        ./composer.phar require --dev "phpstan/phpstan:${PHPSTAN_DEV}" --with-all-dependencies;
      fi
    - ./composer.phar run phpstan
  allow_failure: true

check_php:
  extends: .check_code_php_template
  parallel:
    matrix:
      - PHP_VERSION: "8.4"
      - PHP_VERSION: "8.5"
      - PHP_VERSION: "8.6-rc"
  image: php:${PHP_VERSION}-alpine
  before_script:
    - php --version
    - ./composer.phar --version

# Run npm-based code quality scripts
.check_code_npm_template:
  stage: build
  script:
    - npm ci --ignore-scripts
    - npm run lint:case-sensitive-filenames
    - npm run lint:css
    - npm run lint:dockerfmt
    - npm run lint:eslint
    - npm run lint:eslint-redundancy
    - npm run lint:gitlab-ci
    - npm run lint:htmlhint-completeness
    - npm run lint:htmlvalidate-redundancy
    - npm run lint:ls
    - npm run lint:markdown
    - npm run lint:package-json
    - npm run lint:prettier
    - npm run lint:stylelint-redundancy
    - npm run lint:xml
    - npm run lint:yaml
    - npm run test:node
  allow_failure: true

check_npm:
  extends: .check_code_npm_template
  parallel:
    matrix:
      - NODE_VERSION: 24
      - NODE_VERSION: 26
  image: node:${NODE_VERSION}-alpine
  before_script:
    - node --version
    - npm --version

check_npm_minimum_node_version:
  extends: .check_code_npm_template
  image: debian:stable-slim
  before_script:
    - apt-get update && apt-get install --no-install-recommends -y ca-certificates curl git jq make
    - NODE_VERSION=$(jq --raw-output '.engines.node | match("[0-9]+(\\.[0-9]+){0,2}").string' package.json)
    - curl --fail --silent --show-error --location https://bit.ly/n-install | N_PREFIX=/tmp/n bash -s -- -y "${NODE_VERSION}"
    - export PATH="/tmp/n/bin:$PATH"

.check_code_debian_template:
  stage: build
  before_script:
    # Install dev dependencies
    - apt-get update && apt-get install --no-install-recommends -y $(cat apt_dev_deps.txt)
    # Ignore npm lifecycle scripts: postinstall also runs Playwright setup,
    # which is unnecessary and problematic in these CI jobs.
    - npm ci --ignore-scripts
    - ./composer.phar install --no-interaction
    - grep PRETTY_NAME /etc/os-release | cut -d= -f2 | tr -d '"'
    - node --version
    - npm --version
    - php --version
    - ./composer.phar --version
  script:
    - npm run check
  allow_failure: true

validate_debian:
  extends: .check_code_debian_template
  when: manual
  parallel:
    matrix:
      - IMAGE: "debian:sid-slim"
      - IMAGE: "debian:stable-slim"
      - IMAGE: "ubuntu:devel"
      - IMAGE: "ubuntu:latest"
      - IMAGE: "ubuntu:rolling"
  image: ${IMAGE}

.check_code_alpine_template:
  stage: build
  before_script:
    - apk --no-cache --update add $(cat apk_dev_deps.txt)
    # Ignore npm lifecycle scripts: postinstall also runs Playwright setup,
    # which is unnecessary and problematic in these CI jobs.
    - npm ci --ignore-scripts
    - ./composer.phar install --no-interaction
    - grep PRETTY_NAME /etc/os-release | cut -d= -f2 | tr -d '"'
    - node --version
    - npm --version
    - php --version
    - ./composer.phar --version
  script:
    - npm run check
  allow_failure: true

validate_alpine:
  extends: .check_code_alpine_template
  parallel:
    matrix:
      - IMAGE: "alpine:latest"
      - IMAGE: "alpine:edge"
  image: ${IMAGE}

check_hadolint:
  stage: build
  image:
    name: hadolint/hadolint:latest-alpine
    entrypoint: [""]
  script:
    - hadolint .docker/*Dockerfile
  allow_failure: true
