[php]
allow_url_fopen = Off
disable_functions = exec,passthru,pcntl_exec,popen,proc_open,shell_exec,system
expose_php = Off
file_uploads = Off
; Buffer PHP output to reduce fragmented responses and improve compression.
output_buffering = 16K
post_max_size = 1K

[session]
session.cookie_httponly = On
session.upload_progress.enabled = Off
session.use_strict_mode = On

[apcu]
apc.shm_size = 64M

[opcache]
opcache.memory_consumption = 32M
opcache.save_comments = Off
